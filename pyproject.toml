[project]
name = "devkit"
version = "0.1.0"
description = "Personal agent setup: skills, rules and stack conventions for Claude Code, Codex and Cursor, plus machine bootstrap."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "InquirerPy>=0.3.4",
]

[project.scripts]
devkit = "devkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/devkit/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
